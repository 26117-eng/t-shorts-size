<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>티셔츠 사이즈 찾기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #F5F2ED;
    --surface: #FFFFFF;
    --surface2: #EEEBE5;
    --ink: #1A1A18;
    --ink2: #5A5A55;
    --ink3: #9A9A95;
    --accent: #2D5016;
    --accent2: #5A8A32;
    --accent-light: #E8F2DC;
    --warn: #8A4A1A;
    --warn-light: #F5E8DC;
    --border: rgba(26,26,24,0.12);
    --radius: 12px;
    --radius-sm: 8px;
  }

  body {
    font-family: 'Noto Sans KR', sans-serif;
    background: var(--bg);
    color: var(--ink);
    min-height: 100vh;
    padding: 0;
  }

  .header {
    background: var(--ink);
    color: white;
    padding: 28px 24px 24px;
    text-align: center;
  }
  .header-label {
    font-size: 10px;
    letter-spacing: 4px;
    color: rgba(255,255,255,0.4);
    text-transform: uppercase;
    margin-bottom: 6px;
    font-family: 'DM Mono', monospace;
  }
  .header h1 {
    font-size: 22px;
    font-weight: 700;
    letter-spacing: -0.5px;
  }
  .header p {
    font-size: 13px;
    color: rgba(255,255,255,0.55);
    margin-top: 6px;
    font-weight: 300;
  }

  .main { padding: 20px 16px 40px; max-width: 480px; margin: 0 auto; }

  .card {
    background: var(--surface);
    border-radius: var(--radius);
    border: 0.5px solid var(--border);
    padding: 20px;
    margin-bottom: 14px;
  }

  .section-title {
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--ink3);
    font-family: 'DM Mono', monospace;
    margin-bottom: 16px;
  }

  .field { margin-bottom: 16px; }
  .field:last-child { margin-bottom: 0; }

  .field-label {
    font-size: 13px;
    color: var(--ink2);
    margin-bottom: 6px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .field-value {
    font-family: 'DM Mono', monospace;
    font-size: 14px;
    font-weight: 500;
    color: var(--accent);
    background: var(--accent-light);
    padding: 2px 8px;
    border-radius: 4px;
  }

  input[type="range"] {
    -webkit-appearance: none;
    width: 100%;
    height: 4px;
    background: var(--surface2);
    border-radius: 2px;
    outline: none;
  }
  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 20px;
    height: 20px;
    background: var(--ink);
    border-radius: 50%;
    cursor: pointer;
    transition: transform 0.15s;
  }
  input[type="range"]::-webkit-slider-thumb:hover { transform: scale(1.15); }

  .gender-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
  }
  .gender-btn {
    padding: 12px;
    border: 1.5px solid var(--border);
    border-radius: var(--radius-sm);
    background: transparent;
    font-family: 'Noto Sans KR', sans-serif;
    font-size: 14px;
    font-weight: 400;
    color: var(--ink2);
    cursor: pointer;
    transition: all 0.2s;
    text-align: center;
  }
  .gender-btn.active {
    border-color: var(--ink);
    background: var(--ink);
    color: white;
    font-weight: 500;
  }
  .gender-btn:hover:not(.active) {
    border-color: var(--ink2);
    color: var(--ink);
  }

  .fit-row {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 8px;
  }
  .fit-btn {
    padding: 10px 6px;
    border: 1.5px solid var(--border);
    border-radius: var(--radius-sm);
    background: transparent;
    font-family: 'Noto Sans KR', sans-serif;
    font-size: 12px;
    color: var(--ink2);
    cursor: pointer;
    transition: all 0.2s;
    text-align: center;
  }
  .fit-btn .fit-icon { font-size: 18px; display: block; margin-bottom: 4px; }
  .fit-btn.active {
    border-color: var(--accent2);
    background: var(--accent-light);
    color: var(--accent);
    font-weight: 500;
  }
  .fit-btn:hover:not(.active) { border-color: var(--ink2); }

  .calc-btn {
    width: 100%;
    padding: 16px;
    background: var(--ink);
    color: white;
    border: none;
    border-radius: var(--radius);
    font-family: 'Noto Sans KR', sans-serif;
    font-size: 16px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.2s;
    letter-spacing: 0.5px;
    margin-bottom: 14px;
  }
  .calc-btn:hover { background: #333; transform: translateY(-1px); }
  .calc-btn:active { transform: translateY(0); }

  .result-card {
    display: none;
    background: var(--ink);
    color: white;
    border-radius: var(--radius);
    padding: 28px 20px 24px;
    margin-bottom: 14px;
    text-align: center;
    animation: slideUp 0.35s ease;
  }
  .result-card.show { display: block; }

  @keyframes slideUp {
    from { opacity: 0; transform: translateY(12px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .result-label {
    font-size: 10px;
    letter-spacing: 4px;
    color: rgba(255,255,255,0.4);
    text-transform: uppercase;
    font-family: 'DM Mono', monospace;
    margin-bottom: 8px;
  }
  .result-size {
    font-size: 72px;
    font-weight: 700;
    letter-spacing: -4px;
    line-height: 1;
    margin-bottom: 4px;
  }
  .result-full { font-size: 14px; color: rgba(255,255,255,0.5); margin-bottom: 20px; }

  .result-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    margin-bottom: 20px;
  }
  .result-stat {
    background: rgba(255,255,255,0.08);
    border-radius: var(--radius-sm);
    padding: 12px;
  }
  .result-stat-label { font-size: 10px; color: rgba(255,255,255,0.4); margin-bottom: 4px; }
  .result-stat-val { font-size: 18px; font-weight: 500; font-family: 'DM Mono', monospace; }

  .size-bar {
    display: flex;
    gap: 4px;
    align-items: flex-end;
    height: 36px;
    justify-content: center;
  }
  .size-segment {
    flex: 1;
    border-radius: 3px;
    background: rgba(255,255,255,0.15);
    transition: all 0.3s;
    display: flex;
    align-items: flex-end;
    justify-content: center;
    padding-bottom: 4px;
  }
  .size-segment.match {
    background: rgba(255,255,255,0.85);
    height: 100%;
  }
  .size-segment:not(.match) { height: 40%; }
  .size-segment-label {
    font-size: 9px;
    font-family: 'DM Mono', monospace;
    color: rgba(255,255,255,0.5);
  }
  .size-segment.match .size-segment-label {
    color: var(--ink);
    font-weight: 500;
  }

  .tips-card {
    display: none;
    background: var(--surface);
    border-radius: var(--radius);
    border: 0.5px solid var(--border);
    padding: 20px;
    margin-bottom: 14px;
    animation: slideUp 0.4s ease;
  }
  .tips-card.show { display: block; }

  .tip-row {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    padding: 10px 0;
    border-bottom: 0.5px solid var(--border);
  }
  .tip-row:last-child { border-bottom: none; padding-bottom: 0; }
  .tip-row:first-child { padding-top: 0; }

  .tip-icon {
    width: 32px;
    height: 32px;
    border-radius: 8px;
    background: var(--accent-light);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
    flex-shrink: 0;
  }
  .tip-content { flex: 1; }
  .tip-title { font-size: 13px; font-weight: 500; margin-bottom: 2px; }
  .tip-desc { font-size: 12px; color: var(--ink2); line-height: 1.5; }

  .alt-sizes {
    display: none;
    background: var(--surface);
    border-radius: var(--radius);
    border: 0.5px solid var(--border);
    padding: 20px;
    margin-bottom: 14px;
    animation: slideUp 0.45s ease;
  }
  .alt-sizes.show { display: block; }

  .size-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 0;
    border-bottom: 0.5px solid var(--border);
  }
  .size-row:last-child { border-bottom: none; padding-bottom: 0; }
  .size-row:first-child { padding-top: 0; }

  .size-name { font-family: 'DM Mono', monospace; font-size: 16px; font-weight: 500; }
  .size-match-label {
    font-size: 11px;
    padding: 3px 10px;
    border-radius: 20px;
    font-weight: 500;
  }
  .size-match-best { background: var(--accent-light); color: var(--accent); }
  .size-match-alt { background: var(--surface2); color: var(--ink2); }
  .size-measurements { font-size: 12px; color: var(--ink3); margin-top: 2px; font-family: 'DM Mono', monospace; }
</style>
</head>
<body>

<div class="header">
  <div class="header-label">T-SHIRT SIZER</div>
  <h1>내 사이즈 찾기</h1>
  <p>체형 정보를 입력하면 맞는 사이즈를 추천해드려요</p>
</div>

<div class="main">

  <!-- 성별 -->
  <div class="card">
    <div class="section-title">성별</div>
    <div class="gender-row">
      <button class="gender-btn active" data-gender="male" onclick="selectGender(this)">남성</button>
      <button class="gender-btn" data-gender="female" onclick="selectGender(this)">여성</button>
    </div>
  </div>

  <!-- 키/몸무게/가슴 -->
  <div class="card">
    <div class="section-title">신체 정보</div>

    <div class="field">
      <div class="field-label">
        키
        <span class="field-value" id="height-val">170 cm</span>
      </div>
      <input type="range" id="height" min="145" max="200" value="170" step="1"
             oninput="updateVal('height','height-val','cm')">
    </div>

    <div class="field">
      <div class="field-label">
        몸무게
        <span class="field-value" id="weight-val">65 kg</span>
      </div>
      <input type="range" id="weight" min="40" max="130" value="65" step="1"
             oninput="updateVal('weight','weight-val','kg')">
    </div>

    <div class="field">
      <div class="field-label">
        가슴 둘레 <span style="font-size:11px;color:var(--ink3)">(선택)</span>
        <span class="field-value" id="chest-val">96 cm</span>
      </div>
      <input type="range" id="chest" min="72" max="130" value="96" step="1"
             oninput="updateVal('chest','chest-val','cm')">
    </div>

    <div class="field">
      <div class="field-label">
        어깨 너비 <span style="font-size:11px;color:var(--ink3)">(선택)</span>
        <span class="field-value" id="shoulder-val">44 cm</span>
      </div>
      <input type="range" id="shoulder" min="32" max="60" value="44" step="1"
             oninput="updateVal('shoulder','shoulder-val','cm')">
    </div>
  </div>

  <!-- 핏 선호도 -->
  <div class="card">
    <div class="section-title">선호 핏</div>
    <div class="fit-row">
      <button class="fit-btn" data-fit="slim" onclick="selectFit(this)">
        <span class="fit-icon">🧍</span>슬림핏
      </button>
      <button class="fit-btn active" data-fit="regular" onclick="selectFit(this)">
        <span class="fit-icon">🙂</span>레귤러
      </button>
      <button class="fit-btn" data-fit="loose" onclick="selectFit(this)">
        <span class="fit-icon">🪂</span>오버핏
      </button>
    </div>
  </div>

  <button class="calc-btn" onclick="calculate()">사이즈 추천받기 →</button>

  <!-- 결과 -->
  <div class="result-card" id="result-card">
    <div class="result-label">추천 사이즈</div>
    <div class="result-size" id="result-size">L</div>
    <div class="result-full" id="result-full">Large</div>
    <div class="result-grid">
      <div class="result-stat">
        <div class="result-stat-label">추정 가슴 둘레</div>
        <div class="result-stat-val" id="r-chest">—</div>
      </div>
      <div class="result-stat">
        <div class="result-stat-label">추정 어깨</div>
        <div class="result-stat-val" id="r-shoulder">—</div>
      </div>
    </div>
    <div class="size-bar" id="size-bar"></div>
  </div>

  <!-- 대안 사이즈 -->
  <div class="alt-sizes" id="alt-sizes">
    <div class="section-title">사이즈 비교</div>
    <div id="size-list"></div>
  </div>

  <!-- 팁 -->
  <div class="tips-card" id="tips-card">
    <div class="section-title">착용 팁</div>
    <div id="tips-list"></div>
  </div>

</div>

<script>
let gender = 'male';
let fit = 'regular';

const sizeData = {
  male: [
    { name: 'XS', full: 'Extra Small', chest: [80, 87], shoulder: [38, 41], height: [155, 165], weight: [48, 58] },
    { name: 'S',  full: 'Small',       chest: [86, 93], shoulder: [40, 43], height: [162, 170], weight: [56, 65] },
    { name: 'M',  full: 'Medium',      chest: [92, 99], shoulder: [43, 46], height: [168, 175], weight: [63, 74] },
    { name: 'L',  full: 'Large',       chest: [98,106], shoulder: [46, 49], height: [173, 180], weight: [72, 84] },
    { name: 'XL', full: 'Extra Large', chest: [104,114],shoulder: [48, 52], height: [177, 185], weight: [82, 96] },
    { name: '2XL',full: '2X Large',    chest: [112,122],shoulder: [51, 55], height: [182, 192], weight: [93,110] },
    { name: '3XL',full: '3X Large',    chest: [120,132],shoulder: [54, 58], height: [186, 200], weight: [105,130] },
  ],
  female: [
    { name: 'XS', full: 'Extra Small', chest: [72, 80], shoulder: [34, 37], height: [150, 158], weight: [40, 50] },
    { name: 'S',  full: 'Small',       chest: [79, 86], shoulder: [36, 39], height: [156, 163], weight: [48, 57] },
    { name: 'M',  full: 'Medium',      chest: [85, 92], shoulder: [38, 41], height: [161, 168], weight: [55, 65] },
    { name: 'L',  full: 'Large',       chest: [91, 99], shoulder: [40, 44], height: [165, 173], weight: [63, 75] },
    { name: 'XL', full: 'Extra Large', chest: [97,107], shoulder: [43, 47], height: [170, 178], weight: [73, 86] },
    { name: '2XL',full: '2X Large',    chest: [105,116],shoulder: [46, 50], height: [174, 183], weight: [84, 98] },
    { name: '3XL',full: '3X Large',    chest: [114,126],shoulder: [49, 54], height: [179, 195], weight: [96,120] },
  ]
};

function updateVal(inputId, spanId, unit) {
  document.getElementById(spanId).textContent = document.getElementById(inputId).value + ' ' + unit;
}

function selectGender(btn) {
  document.querySelectorAll('.gender-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  gender = btn.dataset.gender;
  // update defaults
  if (gender === 'female') {
    document.getElementById('height').value = 160;
    document.getElementById('weight').value = 55;
    document.getElementById('chest').value = 85;
    document.getElementById('shoulder').value = 38;
    updateVal('height','height-val','cm');
    updateVal('weight','weight-val','kg');
    updateVal('chest','chest-val','cm');
    updateVal('shoulder','shoulder-val','cm');
  } else {
    document.getElementById('height').value = 170;
    document.getElementById('weight').value = 65;
    document.getElementById('chest').value = 96;
    document.getElementById('shoulder').value = 44;
    updateVal('height','height-val','cm');
    updateVal('weight','weight-val','kg');
    updateVal('chest','chest-val','cm');
    updateVal('shoulder','shoulder-val','cm');
  }
}

function selectFit(btn) {
  document.querySelectorAll('.fit-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  fit = btn.dataset.fit;
}

function score(size, h, w, chest, shoulder) {
  let s = 0;
  if (h >= size.height[0] && h <= size.height[1]) s += 3;
  else s -= Math.min(Math.abs(h - (size.height[0]+size.height[1])/2) / 5, 4);

  if (w >= size.weight[0] && w <= size.weight[1]) s += 3;
  else s -= Math.min(Math.abs(w - (size.weight[0]+size.weight[1])/2) / 5, 4);

  if (chest >= size.chest[0] && chest <= size.chest[1]) s += 4;
  else s -= Math.min(Math.abs(chest - (size.chest[0]+size.chest[1])/2) / 3, 5);

  if (shoulder >= size.shoulder[0] && shoulder <= size.shoulder[1]) s += 3;
  else s -= Math.min(Math.abs(shoulder - (size.shoulder[0]+size.shoulder[1])/2) / 2, 4);

  return s;
}

function calculate() {
  const h = parseInt(document.getElementById('height').value);
  const w = parseInt(document.getElementById('weight').value);
  const chest = parseInt(document.getElementById('chest').value);
  const shoulder = parseInt(document.getElementById('shoulder').value);

  const sizes = sizeData[gender];
  const fitOffset = fit === 'slim' ? -1 : fit === 'loose' ? 1 : 0;

  const scored = sizes.map((s, i) => ({ ...s, idx: i, sc: score(s, h, w, chest, shoulder) }));
  scored.sort((a, b) => b.sc - a.sc);

  let bestIdx = scored[0].idx + fitOffset;
  bestIdx = Math.max(0, Math.min(sizes.length - 1, bestIdx));
  const best = sizes[bestIdx];

  // show result
  document.getElementById('result-size').textContent = best.name;
  document.getElementById('result-full').textContent = best.full;
  document.getElementById('r-chest').textContent = best.chest[0] + '–' + best.chest[1] + ' cm';
  document.getElementById('r-shoulder').textContent = best.shoulder[0] + '–' + best.shoulder[1] + ' cm';

  // size bar
  const bar = document.getElementById('size-bar');
  bar.innerHTML = sizes.map(s =>
    `<div class="size-segment ${s.name === best.name ? 'match' : ''}">
      <span class="size-segment-label">${s.name}</span>
    </div>`
  ).join('');

  // alt sizes
  const prev = bestIdx > 0 ? sizes[bestIdx - 1] : null;
  const next = bestIdx < sizes.length - 1 ? sizes[bestIdx + 1] : null;
  const showSizes = [prev, best, next].filter(Boolean);
  const list = document.getElementById('size-list');
  list.innerHTML = showSizes.map(s => `
    <div class="size-row">
      <div>
        <div class="size-name">${s.name}</div>
        <div class="size-measurements">가슴 ${s.chest[0]}–${s.chest[1]} / 어깨 ${s.shoulder[0]}–${s.shoulder[1]} cm</div>
      </div>
      <span class="size-match-label ${s.name === best.name ? 'size-match-best' : 'size-match-alt'}">
        ${s.name === best.name ? '추천' : '대안'}
      </span>
    </div>
  `).join('');

  // tips
  const fitTips = {
    slim: [
      { icon: '✂️', title: '슬림핏 선택 시', desc: '몸에 딱 붙는 느낌을 원한다면 추천 사이즈 그대로, 조금 여유를 원한다면 한 사이즈 위를 고르세요.' },
      { icon: '🔧', title: '어깨 라인 확인', desc: '슬림핏은 어깨 솔기가 어깨뼈 끝에 정확히 맞아야 가장 예뻐 보입니다.' },
    ],
    regular: [
      { icon: '👕', title: '레귤러핏 기준', desc: '가슴·배 부위에 3–5cm 정도 여유가 있어 활동하기 편안한 핏입니다.' },
      { icon: '📏', title: '어깨 솔기 위치', desc: '어깨 솔기가 어깨뼈 끝에서 1cm 안쪽에 위치하는 것이 이상적입니다.' },
    ],
    loose: [
      { icon: '🌊', title: '오버핏 스타일', desc: '여유롭고 트렌디한 착장을 원한다면 추천 사이즈나 한 사이즈 위를 선택하세요.' },
      { icon: '🎽', title: '길이 체크', desc: '오버핏은 기장이 길어질 수 있으니 온라인 구매 시 총장을 꼭 확인하세요.' },
    ],
  };

  const commonTips = [
    { icon: '🧺', title: '세탁 후 수축', desc: '면 소재는 첫 세탁 시 2–3cm 줄어들 수 있습니다. 100% 면이라면 한 사이즈 위를 추천해요.' },
    { icon: '📐', title: '직접 측정 권장', desc: '브랜드마다 사이즈 편차가 있습니다. 가능하면 가슴 둘레를 직접 줄자로 재서 비교하세요.' },
  ];

  const allTips = [...(fitTips[fit] || fitTips.regular), ...commonTips];
  document.getElementById('tips-list').innerHTML = allTips.map(t => `
    <div class="tip-row">
      <div class="tip-icon">${t.icon}</div>
      <div class="tip-content">
        <div class="tip-title">${t.title}</div>
        <div class="tip-desc">${t.desc}</div>
      </div>
    </div>
  `).join('');

  // show
  const rc = document.getElementById('result-card');
  const ac = document.getElementById('alt-sizes');
  const tc = document.getElementById('tips-card');
  rc.classList.remove('show'); ac.classList.remove('show'); tc.classList.remove('show');
  void rc.offsetWidth;
  rc.classList.add('show');
  setTimeout(() => { ac.classList.remove('show'); void ac.offsetWidth; ac.classList.add('show'); }, 120);
  setTimeout(() => { tc.classList.remove('show'); void tc.offsetWidth; tc.classList.add('show'); }, 200);

  rc.scrollIntoView({ behavior: 'smooth', block: 'start' });
}
</script>
</body>
</html>
